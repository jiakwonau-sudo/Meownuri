name: Resume Muse v15.3 candidate verification
on:
  push:
    branches: ['review/meownuri-9-v15.2-20261005']
    paths: ['qa/continuation_driver_v15_3.py']
permissions:
  contents: read
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archived candidate and extract analysis sources
        run: |
          python - <<'PY'
          import pathlib,re,json,hashlib,base64,subprocess
          raw=pathlib.Path('index.html').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='954d6d00e930e2e95b3595caa69e1515de0d71962dbeccb2d78549214d18011c','Wrong candidate: refusing stale input'
          out=pathlib.Path('qa-resume');out.mkdir()
          scripts=re.findall(r'<script([^>]*)>(.*?)</script>',raw.decode(),re.S)
          (out/'agency.js').write_text(scripts[-1][1])
          syntax=out/'syntax';syntax.mkdir()
          for i,(attrs,body) in enumerate(scripts):
            if 'importmap' in attrs:
              for name,uri in json.loads(body)['imports'].items():(syntax/(name+'.mjs')).write_bytes(base64.b64decode(uri.split(',',1)[1]))
            else:(syntax/('inline'+str(i)+'.mjs')).write_text(body)
          checks=[]
          for path in syntax.glob('*.mjs'):
            r=subprocess.run(['node','--check',str(path)],capture_output=True,text=True)
            checks.append({'file':path.name,'pass':r.returncode==0,'error':r.stderr})
          (out/'syntax.json').write_text(json.dumps(checks,indent=2))
          assert len(checks)==9 and all(c['pass'] for c in checks)
          PY
          node qa/unit_save_patch.cjs qa-resume/agency.js > qa-resume/unit-save.json
          node qa/unit_home_goal_r2.mjs index.html > qa-resume/unit-home.json
      - name: Install existing test browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Continue real-input progression with per-stage diagnostics
        run: python -u qa/continuation_driver_v15_3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muse-v15-3-resume-evidence
          retention-days: 7
          path: |
            qa-resume/
            qa/continuation_driver_v15_3.py
            index.html
