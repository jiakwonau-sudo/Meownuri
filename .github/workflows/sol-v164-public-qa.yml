name: MEOWNURI SOL v16.4 wood joke public preview QA
on:
  push:
    branches: [feat/sol-v16.4-wood-comedy-20261011]
    paths: [.github/workflows/sol-v164-public-qa.yml]
  workflow_dispatch:
jobs:
  public-wood-comedy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify public v16.4 bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 --max-time 75 'https://meownuri-sol-v16-story-preview-3jl6sua3y.vercel.app/' -o /tmp/sol-v164.html
          EXPECTED='58a96f70f3121c7eac18fa3af4dffc477079696bb66174db09dbfdca5756675c'
          ACTUAL=$(sha256sum /tmp/sol-v164.html | awk '{print $1}')
          echo "public_sha256=$ACTUAL"\n          echo "download_bytes=$(wc -c </tmp/sol-v164.html)"\n          head -c 220 /tmp/sol-v164.html | tr '\\n' ' '; echo
          test "$EXPECTED" = "$ACTUAL"
          grep -q 'v16.4' /tmp/sol-v164.html
          echo 'PASS: public URL is byte-identical to local SOL v16.4.'
      - name: Install browser test
        run: npm install --no-save playwright@1.56.1
      - name: Browser wood-comedy QA
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('https://meownuri-sol-v16-story-preview-3jl6sua3y.vercel.app/?scene=gift',{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#solGiftReviewEntry button').click({timeout:40000});
              await page.waitForFunction(()=>window.game?.cut?.scene==='bond',{timeout:30000});
              console.log('rendererMode='+await page.evaluate(()=>game.rendererMode));
              for(const [at,expected] of [[43,'🪵💛'],[51.1,'🪵🍽️❔'],[56.8,'😋❔'],[61.2,'😖'],[66,'😅'],[72,'💛']]){
                const state=await page.evaluate(t=>{
                  while(game.cut?.scene==='bond'&&game.cut.time<t)game.tick(.05);
                  game.renderer.render(game.scene,game.camera);
                  return {t:game.cut?.time,wood:!!game.giftWood?.visible,emoji:window.__MEOWNURI_ROMANCE_EMOJI_QA__?.emoji,scene:game.cut?.scene};
                },at);
                console.log(at,JSON.stringify(state));
                if(!state.wood||state.emoji!==expected)throw new Error('Unexpected wood-comedy scene: '+at+' '+JSON.stringify(state));
                if(at===51.1||at===56.8)await page.screenshot({path:'wood-'+at+'.png'});
              }
              const final=await page.evaluate(()=>{
                while(game.cut?.scene==='bond'&&game.cut.time<89)game.tick(.05);
                return {phase:game.storyPhase,cut:game.cut,friendToken:game.friendToken};
              });
              if(final.phase!==1||final.cut!==null||!final.friendToken)throw new Error('Story did not resume: '+JSON.stringify(final));
              if(errors.length)throw new Error('Browser errors: '+JSON.stringify(errors));
              console.log('PASS: preview browser wood comedy and game resume');
              await page.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-v164-public-wood-comedy-screenshots
          path: wood-*.png
          if-no-files-found: ignore
