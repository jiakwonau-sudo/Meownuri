name: Verify Muse v15.2 forward-port
on:
  push:
    branches: ['review/meownuri-9-v15.2-20261005']
    paths: ['qa/**', '.github/workflows/forwardport-v15-2.yml']
permissions:
  contents: write
jobs:
  verify-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install same browser
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify reachable UI action then complete separate fresh game
        run: python -u qa/retry_v15_2_navigation.py fresh
      - name: Verify evidence and commit exact tested candidate only
        env:
          REVIEW_BRANCH: review/meownuri-9-v15.2-20261005
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,hashlib,os
          expected='a5c9665109b5c58e657cc989850736c134a1403c89df73a5a6f9f056703ff2ec'
          prior=json.loads(pathlib.Path('qa/v15_2_initial_evidence.json').read_text())
          natural=json.loads(pathlib.Path('qa/v15_2_natural_evidence.json').read_text())
          fresh=json.loads(pathlib.Path('qa-continuation/results.json').read_text())
          assert prior['candidate_sha256']==natural['candidate_sha256']==expected
          assert len(prior['passed_cases'])==4 and all(c['status']=='PASS' for c in prior['passed_cases'])
          assert natural['passed_case']['status']=='PASS'
          assert not fresh.get('fatal') and len(fresh['cases'])==1 and fresh['cases'][0]['status']=='PASS'
          assert fresh['navigation_preflight']['pass']
          detail=fresh['cases'][0]['detail']
          assert detail['completed'] and set(detail['ui_save_reload_stages'])=={'home','sunset'}
          assert detail['ending']['ending'] and not detail['ending']['friend']['active'] and not detail['ending']['errors']
          raw=pathlib.Path('qa-continuation/candidate_r2/index.html').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==expected
          combined=[dict(c,run_id=prior['run_id']) for c in prior['passed_cases']]
          combined.append(dict(natural['passed_case'],run_id=natural['run_id']))
          combined.append(dict(fresh['cases'][0],run_id=int(os.environ['GITHUB_RUN_ID'])))
          assert len(combined)==6 and len({c['name'] for c in combined})==6
          m=fresh['manifest'];m.update(candidate_sha256=expected,status='DEFINED FUNCTIONAL ROUTES PASS; NOT FULL RELEASE QA',checks=combined,
            navigation_preflight=fresh['navigation_preflight'],
            capture_warnings=natural['capture_warnings']+fresh.get('capture_warnings',[]),
            historical_failed_runs=[prior['run_id'],natural['run_id'],37249942335],source_test_commit=os.environ['GITHUB_SHA'],
            public_deployment='NOT DEPLOYED; main unchanged',
            limitations=['Original renderer on demand, not continuous FPS testing','Physical Android, audio listening and all choice combinations unverified','Capture warnings are not visual QA passes','Historical candidate_r2 directory contains exact v15.2-r1; identify by hash'])
          pathlib.Path('qa/v15_2_forwardport_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2))
          pathlib.Path('index.html').write_bytes(raw)
          PY
          test "$(git ls-remote origin refs/heads/$REVIEW_BRANCH | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html qa/v15_2_forwardport_manifest.json
          git commit -m 'fix: retain Muse v15.2 SILENT and repair saved journeys and Kkami lifecycle'
          git push origin HEAD:refs/heads/$REVIEW_BRANCH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v15-2-final-fresh-evidence
          retention-days: 7
          path: |
            qa-continuation/
            qa/v15_2_forwardport_manifest.json
            qa/v15_2_initial_evidence.json
            qa/v15_2_natural_evidence.json
            qa/natural_home_ready_37249942335.json
            index.html
