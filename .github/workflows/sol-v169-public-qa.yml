name: SOL v16.9 Day4 overlay mobile QA
on:
  push:
    branches: [feat/sol-v16.9-day4-hud-dismiss-20261012]
    paths: [index.html, tests/sol_v169_mobile_regression.cjs, .github/workflows/sol-v169-public-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-mobile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify tested checkout
        run: |
          git rev-parse HEAD
          sha256sum index.html
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Reproduce original close timing failure
        env:
          QA_CHROME: '1'
        run: node tests/sol_v169_mobile_regression.cjs --baseline
      - name: Run real mobile browser regression
        env:
          QA_CHROME: '1'
        run: node tests/sol_v169_mobile_regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sol-v169-day4-hud-qa
          path: qa-output/
          if-no-files-found: error
